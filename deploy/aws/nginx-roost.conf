# ==============================================================================
# Nginx Reverse Proxy Server Configuration for Roost Backend
# ==============================================================================
# Place this file at: /etc/nginx/conf.d/roost.conf
#
# Test configuration:
#   sudo nginx -t
# Reload Nginx:
#   sudo systemctl reload nginx
#
# Obtain SSL with Let's Encrypt (Certbot will automatically modify this file):
#   sudo certbot --nginx -d api.yourdomain.com
# ==============================================================================

# ------------------------------------------------------------------------------
# Real client address behind CloudFront
# ------------------------------------------------------------------------------
# CloudFront appends the address of the connecting viewer to the END of
# X-Forwarded-For. Everything before it was supplied by the client and can be
# forged, so only the last entry is trusted. Without this, nginx appends the
# CloudFront edge address after it, Spring sees the edge as the client, and
# every user behind the same edge location shares one rate-limit bucket.
#
# If the header is missing or empty (health checks, direct connections) the
# connecting address is used instead.
#
# This is only safe if the instance accepts HTTP from CloudFront alone (limit the
# security group to the CloudFront origin-facing managed prefix list). A caller
# that reaches nginx directly could otherwise choose its own last entry.
map $http_x_forwarded_for $roost_client_ip {
    default                   $remote_addr;
    "~(?<last>[^,\s]+)\s*$"   $last;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Allow up to 100MB request payload for video and high-resolution photo uploads
    client_max_body_size 100M;

    # --------------------------------------------------------------------------
    # Gzip Compression (optimized for JSON REST API and text assets)
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        text/plain
        text/css
        text/javascript
        text/xml
        image/svg+xml;

    # --------------------------------------------------------------------------
    # Direct Nginx Health Check Endpoint
    # --------------------------------------------------------------------------
    # Fast lightweight health check for AWS Route 53 or ALB/NLB target groups
    # without hitting the backend application.
    location = /.nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # --------------------------------------------------------------------------
    # Reverse Proxy to Spring Boot Backend (Embedded Tomcat on port 8080)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Standard forward headers for client IP and protocol tracking.
        # X-Forwarded-For carries exactly one address, the real client (see the
        # map above), so Spring's getRemoteAddr() returns it.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $roost_client_ip;
        proxy_set_header X-Forwarded-For $roost_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeouts for large file uploads and background AI verifications
        proxy_connect_timeout 60s;
        proxy_send_timeout    90s;
        proxy_read_timeout    90s;

        # Buffer configuration for proxying
        proxy_buffer_size          128k;
        proxy_buffers              4 256k;
        proxy_busy_buffers_size    256k;
    }
}
