name: Commit hygiene

# Fails a pull request whose commits carry AI attribution trailers, which
# CLAUDE.md prohibits. Once pushed, such commits stay reachable through
# refs/pull/* and only GitHub Support can purge them, so catch them here.
on:
  pull_request:

# A newer push to the same PR supersedes the older run.
concurrency:
  group: commit-hygiene-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commit-hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history so BASE..HEAD can be walked.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Reject AI attribution trailers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/check-commit-trailers.sh "$BASE_SHA" "$HEAD_SHA"
