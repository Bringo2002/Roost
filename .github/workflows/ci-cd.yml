name: CI/CD — Build, Test & Deploy

# Deploy on every push to main; run tests on PRs.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── 1. Build & Test ────────────────────────────────────────────────────
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: roost_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Run tests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/roost_test
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          JWT_SECRET: ci-test-secret-not-for-production
        run: ./mvnw verify -B -q

      - name: Build production JAR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: ./mvnw package -DskipTests -B -q

      - name: Upload JAR artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: roost-jar
          path: target/*.jar
          retention-days: 3

  # ── 2. Deploy to EC2 (only on push to main, after tests pass) ────────
  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: roost-jar
          path: ./target

      - name: Deploy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: target/*.jar
          target: /tmp/roost-deploy/
          strip_components: 1

      - name: Restart app on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "── Backing up current JAR..."
            sudo cp /opt/roost/app.jar /opt/roost/app.jar.bak 2>/dev/null || true

            echo "── Stopping Roost..."
            sudo systemctl stop roost.service

            echo "── Installing new JAR..."
            sudo mv /tmp/roost-deploy/*.jar /opt/roost/app.jar
            sudo chown roost:roost /opt/roost/app.jar
            rm -rf /tmp/roost-deploy

            echo "── Starting Roost..."
            sudo systemctl start roost.service

            echo "── Waiting for health check..."
            for i in $(seq 1 30); do
              if curl -sf http://127.0.0.1:8080/api/auth/health > /dev/null 2>&1 || \
                 curl -sf -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/ 2>/dev/null | grep -qE '^[2-4]'; then
                echo "✅ App is up and responding!"
                exit 0
              fi
              sleep 2
            done

            echo "❌ Health check failed after 60s — rolling back..."
            sudo systemctl stop roost.service
            sudo cp /opt/roost/app.jar.bak /opt/roost/app.jar 2>/dev/null || true
            sudo chown roost:roost /opt/roost/app.jar
            sudo systemctl start roost.service
            exit 1
