spring.application.name=roost

# Database configuration
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:roost}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# HikariCP: Never crash startup if DB is initializing or delayed
spring.datasource.hikari.initialization-fail-timeout=-1

# Server port
server.port=${PORT:8080}

# Allow larger request bodies for base64-encoded uploads. Chat
# attachments cap raw files at 5MB (~6.7MB after base64); property
# videos cap raw files at 60MB (~80MB after base64, see
# PropertyController.MAX_VIDEO_BYTES) -- the limit here has to cover
# the larger of the two or video uploads get silently rejected by
# Tomcat before the controller's own size check ever runs.
server.tomcat.max-http-form-post-size=90MB
server.tomcat.max-swallow-size=90MB

# Seed data
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# JWT
# Local development only -- production must set JWT_SECRET explicitly
# (see application-production.properties, which has no fallback).
jwt.secret=${JWT_SECRET:S+/spR/O99HzUIhqbjFmX8u1758ro8XVYLs6Knby6sA=}

# CORS -- comma-separated allowlist. Wildcard default is fine for local
# development; native mobile clients don't send an Origin header at all,
# so this only matters for browser-based callers. Production overrides
# this with an explicit allowlist -- see application-production.properties.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Cloudflare R2 (S3-compatible) storage for encrypted chat attachments.
# Set these in Railway once you've created an R2 bucket + API token --
# until then, attachment upload/download returns a clear 503 instead of
# breaking the rest of the app.
r2.account-id=${R2_ACCOUNT_ID:}
r2.access-key-id=${R2_ACCESS_KEY_ID:}
r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
r2.bucket=${R2_BUCKET:}
# Public r2.dev subdomain (or custom domain) for the bucket, once public
# access is enabled on it in the Cloudflare dashboard. Only needed for
# property photo uploads -- chat attachments stay private regardless.
r2.public-base-url=${R2_PUBLIC_BASE_URL:}

# Firebase Cloud Messaging (push notifications). Set FIREBASE_SERVICE_ACCOUNT_JSON
# in Railway to the full contents of a Firebase service account key file
# (Firebase Console -> Project Settings -> Service Accounts -> Generate
# new private key). Until set, push sends are silently no-ops -- nothing
# else in the app depends on this being configured.
firebase.service-account-json=${FIREBASE_SERVICE_ACCOUNT_JSON:}
