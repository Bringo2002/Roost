# Production database (AWS RDS variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${RDS_ENDPOINT:localhost}:${RDS_PORT:5432}/${RDS_DATABASE:roost}?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:roost_admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA — Using 'update' for initial deployment so Hibernate creates all tables.
# Switch back to 'validate' once the schema is established.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway — versioned SQL migrations in src/main/resources/db/migration
# baseline-version=0: ensures all migrations (V1, V2, V3) run on a fresh database.
# On an existing database, baseline-on-migrate stamps version 0 as the baseline,
# so V1+ still execute normally.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Server port (AWS/EC2 environment sets PORT env var)
server.port=${PORT:8080}

# Allow larger request bodies for base64-encoded uploads. Chat
# attachments cap raw files at 5MB (~6.7MB after base64); property
# videos cap raw files at 60MB (~80MB after base64, see
# PropertyController.MAX_VIDEO_BYTES) -- the limit here has to cover
# the larger of the two or video uploads get silently rejected by
# Tomcat before the controller's own size check ever runs.
server.tomcat.max-http-form-post-size=90MB
server.tomcat.max-swallow-size=90MB

# Disable seed data in production
spring.sql.init.mode=never

# HikariCP: Never crash startup if DB is initializing or delayed
spring.datasource.hikari.initialization-fail-timeout=-1

# JWT secret from env var -- required, no fallback. If JWT_SECRET isn't
# set in AWS/EC2, the app fails to start rather than signing tokens with
# a guessable default.
jwt.secret=${JWT_SECRET}

# CORS -- no wildcard fallback in production. Set CORS_ALLOWED_ORIGINS in
# AWS/EC2 to a comma-separated list of real origins once a browser-based
# surface exists (admin panel, web app, etc.). Empty means no
# cross-origin browser caller is trusted yet -- the native Flutter app
# is unaffected, since it never sends an Origin header.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# AWS ALB, CloudFront, or reverse proxy sits in front of this app
# and sets X-Forwarded-For / X-Forwarded-Proto headers. NATIVE tells
# Tomcat to process those headers so that request.getRemoteAddr(),
# getScheme(), etc. reflect the real client values. This replaces the
# hand-rolled X-Forwarded-For parsing that used to live in the controllers.
server.forward-headers-strategy=NATIVE

# AWS S3 storage for encrypted chat attachments and property photos.
# Map old r2.* properties to new S3_* env vars for backward compatibility with R2StorageService.
r2.account-id=not-used-on-aws
r2.access-key-id=${S3_ACCESS_KEY_ID:}
r2.secret-access-key=${S3_SECRET_ACCESS_KEY:}
r2.bucket=${S3_BUCKET:}
r2.public-base-url=${S3_PUBLIC_BASE_URL:}
s3.region=${S3_REGION:eu-north-1}

# Firebase Cloud Messaging (push notifications). Set FIREBASE_SERVICE_ACCOUNT_JSON
# in AWS/EC2 to the full contents of a Firebase service account key file
# (Firebase Console -> Project Settings -> Service Accounts -> Generate
# new private key). Until set, push sends are silently no-ops -- nothing
# else in the app depends on this being configured.
firebase.service-account-json=${FIREBASE_SERVICE_ACCOUNT_JSON:}

# Gemini document fraud-check (see GeminiDocVerificationService). Moved
# server-side from the mobile client -- a key baked into a
# --dart-define release build is extractable from the compiled app.
gemini.api-key=${GEMINI_API_KEY:}

# Tenant caution-flag thresholds (see PropertyRiskService). Each has a
# sensible default baked in via Spring's ${VAR:default} syntax, so none
# of these need to be set for the app to run -- override individually
# via AWS/EC2 env vars once real usage data suggests a threshold needs
# tuning, without a code change or redeploy.
risk.price-outlier-ratio=${RISK_PRICE_OUTLIER_RATIO:0.55}
risk.min-reports-to-flag=${RISK_MIN_REPORTS_TO_FLAG:1}
risk.min-visited-responses-for-ratio=${RISK_MIN_VISITED_RESPONSES_FOR_RATIO:3}
risk.negative-ratio-threshold=${RISK_NEGATIVE_RATIO_THRESHOLD:0.5}
risk.comparable-radius-km=${RISK_COMPARABLE_RADIUS_KM:2.0}
