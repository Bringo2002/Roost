# Production database (Railway variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:${POSTGRES_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:roost}}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:${PGUSER:postgres}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:${PGPASSWORD:postgres}}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server port (Railway sets PORT env var)
server.port=${PORT:8080}

# Disable seed data in production
spring.sql.init.mode=never

# HikariCP: Never crash startup if DB is initializing or delayed
spring.datasource.hikari.initialization-fail-timeout=-1

# JWT secret from env var -- required, no fallback. If JWT_SECRET isn't
# set in Railway, the app fails to start rather than signing tokens with
# a guessable default.
jwt.secret=${JWT_SECRET}

# CORS -- no wildcard fallback in production. Set CORS_ALLOWED_ORIGINS in
# Railway to a comma-separated list of real origins once a browser-based
# surface exists (admin panel, web app, etc.). Empty means no
# cross-origin browser caller is trusted yet -- the native Flutter app
# is unaffected, since it never sends an Origin header.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}


