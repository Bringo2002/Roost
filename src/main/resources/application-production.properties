# Production database (env vars set on EC2 instance)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:${POSTGRES_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:roost}}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:${PGUSER:postgres}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:${PGPASSWORD:postgres}}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA — Flyway owns all schema changes in production; Hibernate only validates.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server port
server.port=${PORT:8080}

# Disable seed data in production
spring.sql.init.mode=never

# HikariCP: Never crash startup if DB is initializing or delayed
spring.datasource.hikari.initialization-fail-timeout=-1

# JWT secret from env var -- required, no fallback. If JWT_SECRET isn't
# set on the server, the app fails to start rather than signing tokens
# with a guessable default.
jwt.secret=${JWT_SECRET}

# CORS -- no wildcard fallback in production. Set CORS_ALLOWED_ORIGINS
# env var to a comma-separated list of real origins once a browser-based
# surface exists (admin panel, web app, etc.). Empty means no
# cross-origin browser caller is trusted yet -- the native Flutter app
# is unaffected, since it never sends an Origin header.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# If running behind a reverse proxy (Nginx, ALB, etc.) that sets
# X-Forwarded-For / X-Forwarded-Proto headers. NATIVE tells Tomcat to
# process those headers so that request.getRemoteAddr(), getScheme(),
# etc. reflect the real client values.
server.forward-headers-strategy=NATIVE
